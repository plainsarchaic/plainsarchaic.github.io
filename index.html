<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Plains Archaic</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: white;
      font-family: sans-serif;
    }

    header {
      padding: 30px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .description {
      margin-top: 10px;
      opacity: 0.6;
      font-size: 0.9rem;
      max-width: 600px;
      line-height: 1.5;
    }

    
.gallery {
    columns: 3;
    column-gap: 12px;
    padding: 12px;
}

.tile {
    display: inline-block;
    width: 100%;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    background: #111;
    break-inside: avoid;
}

.tile img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: opacity 0.4s ease;
}

.tile:hover img {
    opacity: 0.8;
}

/* Image title overlay */
.tile .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    padding: 16px;
    background: linear-gradient(
        transparent 55%,
        rgba(0,0,0,0.65)
    );
    opacity: 0;
    transition: opacity 0.3s ease;
}

.tile:hover .overlay {
    opacity: 1;
}

/* Tablet */
@media (max-width: 900px) {
    .gallery {
        columns: 2;
    }
}

/* Mobile */
@media (max-width: 550px) {
    .gallery {
        columns: 2;
        column-gap: 7px;
        padding: 7px;
    }

    .tile {
        margin-bottom: 7px;
    }
}

}

    }
  </style>
</head>

<body>

  <header>
    <h1>Plains Archaic</h1>

    <div class="description">
      Digital archive 
    </div>
  </header>

  <main class="gallery">

    <a class="tile" href="releases/release1.html">
      <img src="images/release1.jpg" alt="Release 1">

      <div class="overlay">
        <div class="title">Release One</div>
      </div>
    </a>

    <a class="tile" href="releases/release2.html">
      <img src="images/release2.jpg" alt="Release 2">

      <div class="overlay">
        <div class="title">Release Two</div>
      </div>
    </a>

    <a class="tile" href="releases/release3.html">
      <img src="images/8.11.23 show final for website.png" alt="Label Showcase">

      <div class="overlay">
        <div class="title">Release Three</div>
      </div>
    </a>

    <a class="tile" href="releases/pa1.html">
      <img src="images/PA1 digital.png" alt="PA1">

      <div class="overlay">
        <div class="title">PA1</div>
      </div>
    </a>

  </main>

  <footer>
    Plains Archaic — Independent Archive
  </footer>

</body>
</html>
